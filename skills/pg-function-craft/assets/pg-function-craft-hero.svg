<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">pg-function-craft</title>
  <desc id="desc">PostgreSQL function engineering skill for generation, rewriting and review.</desc>
  <defs>
