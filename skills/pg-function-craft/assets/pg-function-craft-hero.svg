      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="72" r="150" fill="#38bdf8" opacity=".08"/>
  <circle cx="1160" cy="360" r="220" fill="#a78bfa" opacity=".08"/>
  <path d="M0 350 C210 290 310 390 500 330 S820 260 1280 320" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 375 C240 315 370 420 590 355 S920 300 1280 350" fill="none" stroke="#a78bfa" stroke-opacity=".12" stroke-width="2"/>

  <g transform="translate(86 82)">
