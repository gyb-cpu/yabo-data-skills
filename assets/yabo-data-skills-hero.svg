<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">yabo-data-skills</title>
  <desc id="desc">可复用的 Agent Skills 集合：PostgreSQL 函数工程与申能 DWD 开发流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="60" r="160" fill="#38bdf8" opacity=".08"/>
  <circle cx="1170" cy="350" r="230" fill="#a78bfa" opacity=".08"/>
  <path d="M0 330 C210 270 310 370 500 310 S820 240 1280 300" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 355 C240 295 370 400 590 335 S920 280 1280 330" fill="none" stroke="#a78bfa" stroke-opacity=".12" stroke-width="2"/>

  <g transform="translate(84 76)">
    <rect x="0" y="0" width="112" height="112" rx="24" fill="#0f1d35" stroke="#38bdf8" stroke-opacity=".65" stroke-width="2"/>
    <ellipse cx="56" cy="36" rx="27" ry="11" fill="none" stroke="url(#accent)" stroke-width="5" filter="url(#glow)"/>
    <path d="M29 36v22c0 6 12 11 27 11s27-5 27-11V36" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M29 58v22c0 6 12 11 27 11s27-5 27-11V58" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </g>

  <text x="234" y="126" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-.8">yabo-data-skills</text>
  <text x="236" y="172" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="24">可复用的 Agent Skills 集合 · 不绑定任何 Agent 或 IDE</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="19">
    <rect x="236" y="204" width="252" height="46" rx="23" fill="#0f1d35" stroke="#38bdf8" stroke-opacity=".5"/>
    <text x="362" y="233" fill="#7dd3fc" text-anchor="middle">pg-function-craft</text>

    <rect x="504" y="204" width="300" height="46" rx="23" fill="#0f1d35" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="654" y="233" fill="#c4b5fd" text-anchor="middle">shenergy-dwd-development</text>
  </g>

  <text x="236" y="300" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="19">PostgreSQL / Greenplum 函数工程 · 申能各省份 DWD 开发流程</text>

  <g transform="translate(960 196)" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="0" y="0" width="150" height="38" rx="10" fill="#101c33" stroke="#1e3a5f"/>
    <text x="75" y="25" fill="#94a3b8" text-anchor="middle">SKILL.md</text>

    <rect x="0" y="52" width="150" height="38" rx="10" fill="#101c33" stroke="#1e3a5f"/>
    <text x="75" y="77" fill="#94a3b8" text-anchor="middle">references/</text>

    <rect x="0" y="104" width="150" height="38" rx="10" fill="#101c33" stroke="#1e3a5f"/>
    <text x="75" y="129" fill="#94a3b8" text-anchor="middle">tests/</text>
  </g>
</svg>
