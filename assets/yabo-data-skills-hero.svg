<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="616" viewBox="0 0 1600 616" role="img" aria-labelledby="title desc">
  <title id="title">yabo-data-skills</title>
  <desc id="desc">可复用的 Agent Skills 集合：PostgreSQL 函数工程与申能 DWD 开发流程。</desc>
  <defs>
